version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: erp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: erp_backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/erp
      JWT_SECRET: supersecret

  frontend:
    build: ./frontend
    container_name: erp_frontend
    ports:
      - "3000:3000"